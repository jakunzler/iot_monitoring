.3025,83.5938 M300.3025,102.5938 L287.3025,117.5938 M300.3025,102.5938 L313.3025,117.5938" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="107.7139" x="184.97" y="132.0889">Vehicle / bench</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="230.665" x="184.97" y="148.3857">(PiCarX: 5G Quectel RM520N-GL,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="99.1963" x="184.97" y="164.6826">Wi-Fi fallback)</text></g><!--entity Esp--><g class="entity" data-qualified-name="Esp" data-source-line="10" id="ent0004"><ellipse cx="552.2991" cy="75.7337" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M552.2991,83.7337 L552.2991,110.7337 M539.2991,91.7337 L565.2991,91.7337 M552.2991,110.7337 L539.2991,125.7337 M552.2991,110.7337 L565.2991,125.7337" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.4248" x="452.18" y="140.2289">ESP32 device</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="200.2383" x="452.18" y="156.5257">(Wi-Fi and/or LoRa, optional)</text></g><g class="entity" data-qualified-name="GMN9" data-source-line="20" id="ent0010"><path d="M423.52,266.1437 L423.52,282.2737 L389.33,286.2737 L423.52,290.2737 L423.52,306.4094 A0,0 0 0 0 423.52,306.4094 L745.0879,306.4094 A0,0 0 0 0 745.0879,306.4094 L745.0879,276.1437 L735.0879,266.1437 L423.52,266.1437 A0,0 0 0 0 423.52,266.1437" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M735.0879,266.1437 L735.0879,276.1437 L745.0879,276.1437 L735.0879,266.1437" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="300.5679" x="429.52" y="283.2106">The system exposes a REST API and a web UI.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.1401" x="429.52" y="298.3435">Local persistence: SQLite on the API server.</text></g><!--link Ops to Sys--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" data-source-line="15" id="lnk6"><path d="M63.09,160.1338 C65.87,183.8637 73.22,211.6737 91.3,229.9838 C122.55,261.6238 163.7139,274.9503 205.3039,281.0703" fill="none" id="Ops-to-Sys" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="211.24,281.9438,202.9182,276.6761,206.2933,281.2158,201.7536,284.5909,211.24,281.9438" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.7456" x="92.3" y="211.0506">browses dashboards &amp; history</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="93.4565" x="143.9445" y="226.1835">(web browser)</text></g><!--link Edge to Sys--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" data-source-line="16" id="lnk7"><path d="M297.72,168.2737 C297.1,187.7137 296.75,209.8337 297.3,229.9838 C297.56,239.6838 297.7501,244.3534 298.2801,253.6934" fill="none" id="Edge-to-Sys" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="298.62,259.6838,302.1037,250.4716,298.3367,254.6918,294.1165,250.9248,298.62,259.6838" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.8311" x="298.3" y="218.5506">sends HTTP readings (publisher)</text></g><!--link Esp to Sys--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="17" id="lnk8"><path d="M547.32,160.1338 C542.41,184.0138 532.66,211.9637 513.3,229.9838 C510.84,232.2737 452.2892,247.3521 394.