version: '3.8'

services:
  # Frontend React App
  frontend:
    build: .
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - iot-network

  # Backend Flask API
  backend:
    image: python:3.11-slim
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    working_dir: /app
    command: >
      sh -c "pip install -r requirements.txt &&
             python server.py"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=server.py
    networks:
      - iot-network

networks:
  iot-network:
    driver: bridge

volumes:
  data:
